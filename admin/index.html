<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFS Admin — Runtime Configuration</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
  <div id="login-screen" class="screen hidden">
    <div class="card login-card">
      <h1>AFS Admin</h1>
      <label for="api-key-input">Password</label>
      <input id="api-key-input" type="password" placeholder="From ADMIN_API_KEY in .env" autocomplete="off">
      <button id="login-btn" type="button">Connect</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div>
        <h1>AFS Runtime Config</h1>
      </div>
      <div class="topbar-actions">
        <button id="reload-btn" type="button" class="secondary">Reload</button>
        <button id="reset-btn" type="button" class="danger">Reset to defaults</button>
        <button id="save-btn" type="button" class="primary">Save changes</button>
      </div>
    </header>

    <div id="status-banner" class="banner hidden"></div>

    <nav class="tabs" id="tabs"></nav>

    <main id="panels" class="panels"></main>

    <section class="audit-section">
      <h2>Recent changes</h2>
      <div id="audit-log" class="audit-log"></div>
    </section>
  </div>

  <script src="/admin/admin.js?v=13"></script>
</body>

</html>
