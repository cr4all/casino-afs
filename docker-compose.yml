# Secrets: set POSTGRES_*, REDIS_*, RABBITMQ_*, ADMIN_API_KEY in root .env (gitignored).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AfsP0stgr3s_D0ck3r!2026}
      POSTGRES_DB: ${POSTGRES_DB:-afs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afs} -d ${POSTGRES_DB:-afs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-AfsR3d1s_D0ck3r!2026#Kx9mP2vL7n}"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AfsR3d1s_D0ck3r!2026#Kx9mP2vL7n}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-afs_mq_prod}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-MqPubl1c_AFS!2026_Kx9mP2vL7nQw8zR4}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  risk:
    build:
      context: .
      dockerfile: Dockerfile
      target: risk
    ports:
      - "${RISK_PORT:-8001}:8001"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AfsP0stgr3s_D0ck3r!2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-afs}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-afs_mq_prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-MqPubl1c_AFS!2026_Kx9mP2vL7nQw8zR4}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_PUBLISH_RESULTS: ${RABBITMQ_PUBLISH_RESULTS:-true}
      RABBITMQ_EVENTS_EXCHANGE: casino.events
      RABBITMQ_EVENTS_EXCHANGE_TYPE: topic
      RABBITMQ_EVENTS_QUEUE: casino.afs
      RABBITMQ_EVENTS_BINDING_KEY: "#"
      RABBITMQ_RESULTS_QUEUE: risk.results
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-AfsR3d1s_D0ck3r!2026#Kx9mP2vL7n}
      REDIS_DB: "0"
      SYNC_PUBLISH_AUDIT: "true"
      IP_INTEL_ENABLED: "true"
      IP_INTEL_FAIL_OPEN: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-lkdjf#Kjlk3jF#LKJfj3kF#}
    volumes:
      - ./data:/app/data
      - ./admin:/app/admin:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8002}:8002"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AfsP0stgr3s_D0ck3r!2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-afs}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-afs_mq_prod}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-MqPubl1c_AFS!2026_Kx9mP2vL7nQw8zR4}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_RESULTS_QUEUE: risk.results
      RABBITMQ_ACTIONS_QUEUE: risk.actions
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
